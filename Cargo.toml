[package]
name = "phantom-osint"
version = "0.1.0"
edition = "2021"
authors = ["DBISHT4U <dbisht717@gmail.com>"]
description = "👻 Blazing-fast username hunter — find anyone's digital footprint across 400+ sites in seconds. Rust-powered OSINT."
license = "MIT"
readme = "README.md"
repository = "https://github.com/DBISHT4U/phantom"
keywords = ["osint", "username", "security", "reconnaissance", "sherlock"]
categories = ["command-line-utilities", "web-programming"]

[[bin]]
name = "phantom"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
clap = { version = "4", features = ["derive"] }
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indicatif = "0.17"
anyhow = "1"
futures = "0.3"
tabled = "0.15"
chrono = "0.4"
regex = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
